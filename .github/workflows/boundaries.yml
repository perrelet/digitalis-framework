name: boundaries

on:
  push:
    branches: [main, v1]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php bin/boundaries.php
      - run: php bin/scripts.php
      - run: for f in $(php bin/scripts.php --list); do node --input-type=module --check < "$f" || exit 1; done
